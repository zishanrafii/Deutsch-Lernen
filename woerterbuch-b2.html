<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wörterbuch B2 — Deutsch Lernen</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/woerterbuch-shared.css">
<style>
:root{
  --accent1:#a78bfa;--accent2:#8b5cf6;--accent-glow:rgba(167,139,250,.22);
}
</style>
<link href="/css/user-menu.css" rel="stylesheet">
<style>.user-section,#nav-avatar,#nav-name,#btn-logout,#btn-logout-top{display:none!important}</style>
<link href="/css/bottom-nav.css" rel="stylesheet">
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🇩🇪</div>
    <div class="logo-text"><h1>Deutsch Lernen</h1><p>WÖRTERBUCH · B2</p></div>
  </div>
  <div class="user-section">
    <a href="woerterbuch.html" class="btn-back">← Levels</a>
    <div id="user-menu-container"></div>
      <div class="user-avatar" id="nav-avatar">👤</div>
    <span class="user-name" id="nav-name">লোড হচ্ছে...</span>
    <button class="btn-logout" id="btn-logout">Logout</button>
  </div>
</div>

<div class="wrap">

  <!-- GRID VIEW -->
  <div id="grid-view">
    <div class="page-head">
      <div>
        <h2>B2 · Obere Mittelstufe</h2>
        <p>প্রতি sub-level-এ ২০টা শব্দ। আগের sub-level-এর ৭০% শব্দ master করলে পরেরটা unlock হবে।</p>
      </div>
    </div>
        <div class="dict-search">
      <span class="dict-search-icon">🔍</span>
      <input type="text" id="dict-search-input" placeholder="German বা বাংলা শব্দ লিখে খুঁজুন..." autocomplete="off">
      <button class="dict-search-clear" id="dict-search-clear" aria-label="Clear">✕</button>
    </div>
    <div class="dict-results hidden" id="dict-results"></div>

    <div class="sub-grid" id="sub-grid"></div>
  </div>

  <!-- FLASHCARD VIEW -->
  <div id="flash-view" class="hidden">
    <div class="flash-wrap">
      <div class="flash-progress">
        <span id="flash-sublevel-label">Sub-level 1</span>
        <span id="flash-count">1 / 20</span>
      </div>
      <div class="flash-track"><div class="flash-bar" id="flash-bar"></div></div>

      <div class="card" id="flash-card">
        <div class="card-front" id="card-front">
          <div class="german" id="card-german"></div>
          <div class="card-hint">কার্ডে ক্লিক করে অর্থ দেখো</div>
        </div>
        <div class="card-back hidden" id="card-back">
          <div class="bengali" id="card-bengali"></div>
          <div class="example" id="card-example"></div>
        </div>
      </div>

      <div class="flash-actions hidden" id="flash-actions">
        <button class="btn-dontknow" id="btn-dontknow">জানি না</button>
        <button class="btn-know" id="btn-know">✅ জানি</button>
      </div>
    </div>

    <div class="complete-screen hidden" id="complete-screen">
      <div class="emoji">🎉</div>
      <h3 id="complete-title">Sub-level সম্পন্ন!</h3>
      <p id="complete-stats">তুমি ১৫/২০ শব্দ master করেছো এই sub-level-এ।</p>
      <button class="btn-primary" id="btn-back-to-grid">Sub-level লিস্টে ফিরে যাও</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import {
  auth, db, signOut, initAuthOptional,
  doc, getDoc, updateDoc, arrayUnion, increment
} from "./js/firebase-config.js";
import { vocabB2 } from "./js/vocab-b2-data.js";
import { initDictSearch } from "./js/dict-search.js";

const SUBLEVEL_SIZE = 20;
const UNLOCK_RATIO = 0.7;

function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}
const subLevels = chunk(vocabB2, SUBLEVEL_SIZE);

initDictSearch({ words: vocabB2 });

let masteredSet = new Set();
let uid = null;
let currentSubIdx = 0;
let currentCardIdx = 0;
let flipped = false;

document.getElementById("btn-logout").addEventListener("click", async () => {
  if (uid) await signOut(auth);
  location.href = "index.html";
});

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function subLevelStats(idx) {
  const words = subLevels[idx];
  const total = words.length;
  const masteredCount = words.filter(w => masteredSet.has(w.id)).length;
  const pct = total > 0 ? Math.round((masteredCount / total) * 100) : 0;
  return { total, masteredCount, pct };
}

function isUnlocked(idx) {
  if (idx === 0) return true;
  const prev = subLevelStats(idx - 1);
  return prev.masteredCount >= Math.ceil(UNLOCK_RATIO * prev.total);
}

function renderGrid() {
  const grid = document.getElementById("sub-grid");
  grid.innerHTML = "";
  subLevels.forEach((words, idx) => {
    const stats = subLevelStats(idx);
    const unlocked = isUnlocked(idx);
    const card = document.createElement("div");
    card.className = "sub-card" + (unlocked ? "" : " locked");
    const startNum = idx * SUBLEVEL_SIZE + 1;
    const endNum = idx * SUBLEVEL_SIZE + words.length;
    card.innerHTML = unlocked
      ? `<div class="sub-num">${idx + 1}</div>
         <div class="sub-range">#${startNum}-${endNum}</div>
         <div class="sub-track"><div class="sub-fill" style="width:${stats.pct}%"></div></div>
         <div class="sub-pct">${stats.masteredCount}/${stats.total} · ${stats.pct}%</div>`
      : `<div class="sub-lock-icon">🔒</div>
         <div class="sub-range">#${startNum}-${endNum}</div>`;
    if (unlocked) card.addEventListener("click", () => openSubLevel(idx));
    grid.appendChild(card);
  });
}

function openSubLevel(idx) {
  currentSubIdx = idx;
  currentCardIdx = 0;
  document.getElementById("grid-view").classList.add("hidden");
  document.getElementById("flash-view").classList.remove("hidden");
  document.getElementById("complete-screen").classList.add("hidden");
  document.getElementById("flash-card").classList.remove("hidden");
  document.getElementById("flash-actions").classList.remove("hidden");
  renderCard();
}

function renderCard() {
  const words = subLevels[currentSubIdx];
  const word = words[currentCardIdx];
  flipped = false;
  document.getElementById("card-front").classList.remove("hidden");
  document.getElementById("card-back").classList.add("hidden");
  document.getElementById("card-german").textContent = word.german;
  document.getElementById("card-bengali").textContent = word.bengali;
  document.getElementById("card-example").textContent = word.example;
  document.getElementById("flash-sublevel-label").textContent = `Sub-level ${currentSubIdx + 1}`;
  document.getElementById("flash-count").textContent = `${currentCardIdx + 1} / ${words.length}`;
  document.getElementById("flash-bar").style.width = `${((currentCardIdx) / words.length) * 100}%`;
}

document.getElementById("flash-card").addEventListener("click", () => {
  flipped = !flipped;
  document.getElementById("card-front").classList.toggle("hidden", flipped);
  document.getElementById("card-back").classList.toggle("hidden", !flipped);
});

async function markKnown() {
  const word = subLevels[currentSubIdx][currentCardIdx];
  if (!masteredSet.has(word.id)) {
    masteredSet.add(word.id);
    if (uid) {
      try {
        await updateDoc(doc(db, "users", uid), {
          masteredVocabIds: arrayUnion(word.id),
          xp: increment(5)
        });
        showToast(`+5 XP — "${word.german}" মনে রেখেছো!`);
      } catch (e) {
        showToast("সংরক্ষণ করতে সমস্যা হয়েছে, ইন্টারনেট চেক করো।");
        masteredSet.delete(word.id);
        return;
      }
    } else {
      showToast(`"${word.german}" মনে রেখেছো! Progress save করতে login করো।`);
    }
  }
  nextCard();
}

function nextCard() {
  const words = subLevels[currentSubIdx];
  if (currentCardIdx < words.length - 1) {
    currentCardIdx++;
    renderCard();
  } else {
    finishSubLevel();
  }
}

document.getElementById("btn-know").addEventListener("click", (e) => { e.stopPropagation(); markKnown(); });
document.getElementById("btn-dontknow").addEventListener("click", (e) => { e.stopPropagation(); nextCard(); });

function finishSubLevel() {
  const stats = subLevelStats(currentSubIdx);
  document.getElementById("flash-card").classList.add("hidden");
  document.getElementById("flash-actions").classList.add("hidden");
  document.getElementById("complete-screen").classList.remove("hidden");
  document.getElementById("complete-stats").textContent =
    `তুমি ${stats.masteredCount}/${stats.total} শব্দ master করেছো এই sub-level-এ (${stats.pct}%)।`;
  const nextUnlocked = isUnlocked(currentSubIdx + 1);
  if (subLevels[currentSubIdx + 1] && !nextUnlocked) {
    document.getElementById("complete-title").textContent = "আরও practice করো";
  } else {
    document.getElementById("complete-title").textContent = "🎉 Sub-level সম্পন্ন!";
  }
}

document.getElementById("btn-back-to-grid").addEventListener("click", () => {
  document.getElementById("flash-view").classList.add("hidden");
  document.getElementById("grid-view").classList.remove("hidden");
  renderGrid();
});

initAuthOptional(async (user) => {
  if (user) {
    uid = user.uid;
    const uSnap = await getDoc(doc(db, "users", uid));
    const d = uSnap.exists() ? uSnap.data() : {};
    const name = d.displayName || user.displayName || "Lerner";
    const photo = d.photoURL || user.photoURL || "";
    document.getElementById("nav-name").textContent = name;
    const av = document.getElementById("nav-avatar");
    if (photo) av.innerHTML = `<img src="${photo}" alt="avatar">`;
    else av.textContent = name[0]?.toUpperCase() || "?";

    const ids = d.masteredVocabIds || [];
    masteredSet = new Set(ids.filter(id => id.startsWith("b2-")));
  } else {
    uid = null;
    document.getElementById("nav-name").textContent = "Guest — লগইন করো";
    document.getElementById("nav-avatar").textContent = "👤";
    document.getElementById("btn-logout").textContent = "Login";
  }
  renderGrid();
});
</script>


<script type="module">
import { renderUserMenu } from "/js/user-menu.js";
function dlMirrorUserMenu(){
  const nameEl = document.getElementById("nav-name");
  const container = document.getElementById("user-menu-container");
  const oldLogout = document.getElementById("btn-logout") || document.getElementById("btn-logout-top");
  if(!nameEl || !container) return;
  const name = (nameEl.textContent||"").trim();
  if(!name || /\.\.\.|loading|\u09B2\u09CB\u09A1/i.test(name)) return;
  const av = document.getElementById("nav-avatar");
  const img = av ? av.querySelector("img") : null;
  const photo = img ? img.getAttribute("src") : "";
  renderUserMenu(container, {
    name, photo, plan: "free",
    onLogout: () => oldLogout && oldLogout.click(),
  });
}
let dlTries = 0;
const dlIv = setInterval(() => { dlMirrorUserMenu(); if(++dlTries > 30) clearInterval(dlIv); }, 250);
</script>

<script type="module">
import { renderBottomNav } from "/js/bottom-nav.js";
renderBottomNav();
</script>
</body>
</html>
