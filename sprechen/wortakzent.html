*{box-sizing:border-box;margin:0;padding:0}
:root{

  --gold:#f5c842;--teal:#2dd4bf;--rose:#fb7185;--indigo:#818cf8;
  --emerald:#34d399;--muted:#64748b;--sub:#94a3b8;--text:#f0f4f8;
  --accent:#38bdf8;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 0% 0%,rgba(245,200,66,.055),transparent 60%),

body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;

.wrap{max-width:900px;margin:auto;padding:1.6rem 1.4rem 4rem;position:relative;z-index:1;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;gap:1rem;flex-wrap:wrap;

.logo{display:flex;align-items:center;gap:14px;}
.logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(245,200,66,.18),rgba(45,212,191,.1));
  border:1px solid rgba(245,200,66,.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.logo-text h1{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#f5c842,#2dd4bf);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-text p{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.user-avatar{width:36px;height:36px;border-radius:50%;background:rgba(245,200,66,.15);

.btn-logout{border:1px solid rgba(251,113,133,.2);background:rgba(251,113,133,.07);color:var(--rose);

.breadcrumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:1.2rem;font-family:'JetBrains Mono',monospace;flex-wrap:wrap;}
.breadcrumb a{color:var(--sub);text-decoration:none;}.breadcrumb a:hover{color:var(--gold);}
/* HERO */
.hero{border-radius:22px;padding:1.8rem 2.2rem;margin-bottom:1.6rem;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#080e18,#0a1220);border:1px solid rgba(255,255,255,.07);}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent) 40%,#2dd4bf 70%,transparent);}
.hero-orb{position:absolute;width:220px;height:220px;border-radius:50%;

.hero-inner{position:relative;z-index:2;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;}
.hero-icon{font-size:3.5rem;flex-shrink:0;}
.hero-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:.4rem;opacity:.8;color:var(--accent);}
.hero h2{font-size:1.8rem;font-weight:800;letter-spacing:-.4px;margin-bottom:.3rem;}
.hero-sub{color:var(--sub);font-size:13px;line-height:1.65;font-family:'Noto Sans Bengali',sans-serif;}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:.8rem;}
.meta-pill{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--sub);}
.meta-pill.accent{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.25);color:var(--gold);}

.section-title{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:10px;
  letter-spacing:1.5px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}
/* THEORY BOX */
.theory-box{background:var(--surface2);border:1px solid var(--border);border-radius:18px;
  padding:1.4rem 1.6rem;margin-bottom:1.6rem;position:relative;overflow:hidden;}
.theory-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.theory-box p{font-size:13.5px;line-height:1.8;color:var(--sub);font-family:'Noto Sans Bengali',sans-serif;margin-bottom:.8rem;}
.theory-box p:last-child{margin-bottom:0;}
.theory-box strong{color:var(--text);}
.tip-box{background:rgba(245,200,66,.05);border:1px solid rgba(245,200,66,.18);border-radius:12px;

.tip-box strong{color:var(--gold);}

.examples-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:1.6rem;}
.ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem;
  transition:.2s;position:relative;overflow:hidden;}
.ex-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:3px 0 0 3px;}
.ex-card:hover{border-color:rgba(255,255,255,.09);transform:translateY(-2px);}
.ex-word{font-size:1.2rem;font-weight:800;margin-bottom:.2rem;}
.ex-ipa{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--indigo);margin-bottom:.3rem;}
.ex-bn{font-size:12px;color:var(--sub);font-family:'Noto Sans Bengali',sans-serif;margin-bottom:.6rem;}
.ex-sentence{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:.7rem;}
.play-btn{background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.25);color:var(--teal);
  padding:3px 12px;border-radius:20px;cursor:pointer;font-size:11.5px;font-weight:700;
  font-family:'Outfit',sans-serif;transition:.2s;display:inline-flex;align-items:center;gap:5px;}
.play-btn:hover{background:rgba(45,212,191,.2);}
.play-btn.playing{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.25);color:var(--rose);}
/* VOICE SELECTOR */
.voice-bar{display:flex;align-items:center;gap:8px;margin-bottom:1.2rem;flex-wrap:wrap;}
.voice-label{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.vbtn{padding:.3rem .9rem;border-radius:20px;font-size:11.5px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'JetBrains Mono',monospace;transition:.2s;}
.vbtn.active{background:rgba(244,114,182,.1);border-color:rgba(244,114,182,.3);color:#f472b6;}
.vbtn.male-active{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.3);color:#38bdf8;}
/* EXERCISES */
.exercises-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:18px;
  padding:1.4rem 1.6rem;margin-bottom:1.6rem;}
.ex-item{margin-bottom:1.2rem;padding-bottom:1.2rem;border-bottom:1px solid rgba(255,255,255,.04);}
.ex-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.ex-q{font-size:13.5px;font-weight:700;margin-bottom:.7rem;font-family:'Noto Sans Bengali',sans-serif;}
.ex-opts{display:flex;gap:8px;flex-wrap:wrap;}
.opt-btn{padding:.4rem 1rem;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);
  color:var(--sub);cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;transition:.2s;}
.opt-btn:hover{border-color:rgba(255,255,255,.15);color:var(--text);}
.opt-btn.correct{background:rgba(52,211,153,.12);border-color:#34d399;color:#34d399;}
.opt-btn.wrong{background:rgba(251,113,133,.1);border-color:var(--rose);color:var(--rose);}
.ex-feedback{font-size:12px;margin-top:.5rem;font-family:'Noto Sans Bengali',sans-serif;min-height:18px;}
/* PROGRESS */
.xp-banner{background:linear-gradient(135deg,rgba(245,200,66,.08),rgba(45,212,191,.06));
  border:1px solid rgba(245,200,66,.2);border-radius:16px;padding:1.1rem 1.4rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem;}
.xp-left{font-size:13px;font-family:'Noto Sans Bengali',sans-serif;color:var(--sub);}
.xp-left strong{color:var(--text);font-size:15px;}
.btn-complete{background:linear-gradient(135deg,#f5c842,#e0a820);color:#000;font-weight:800;border:none;
  border-radius:12px;padding:.65rem 1.4rem;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;
  transition:.2s;display:inline-flex;align-items:center;gap:6px;}
.btn-complete:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,200,66,.3);}
.btn-complete:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}
/* NAV BUTTONS */
.page-nav{display:flex;align-items:center;justify-content:space-between;margin-top:2rem;gap:1rem;flex-wrap:wrap;}
.nav-btn{padding:.6rem 1.2rem;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;transition:.2s;font-family:'Outfit',sans-serif;}
.nav-btn:hover{border-color:rgba(255,255,255,.15);color:var(--text);}
.nav-btn.gold{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.3);color:var(--gold);}
.nav-btn.gold:hover{background:rgba(245,200,66,.18);}
@media(max-width:600px){.wrap{padding:1rem .9rem 3rem;}.hero h2{font-size:1.5rem;}.topbar{flex-direction:column;align-items:flex-start;}}
</style>

  document.getElementById("meta-exercises").textContent = `5 ${getLang()==="en"?"Exercises":"Exercises"}`;
  document.getElementById("theory-title").textContent = c.theoryTitle;
  document.getElementById("examples-title").textContent = c.examplesTitle;
  document.getElementById("exercises-title").textContent = c.exercisesTitle;
  document.getElementById("theory-box").innerHTML = getLang() === "en" ? THEORY_EN : THEORY_BN;
  document.getElementById("xp-banner-text").innerHTML =
    `<strong>Wortakzent</strong> ${c.xpAfter} <strong style="color:var(--gold)">+40 XP</strong>` +
    `<div style="margin-top:3px;font-size:11.5px;">${c.xpHint}</div>`;
  const btn = document.getElementById("btn-complete");
  if (_completed) { btn.disabled = true; btn.textContent = c.alreadyCompleted; }
  else { btn.textContent = c.completeBtn + " (+40 XP)"; }
  const nextLbl = document.getElementById("next-topic-label");
  if (nextLbl) nextLbl.textContent = (getLang()==="en" ? "Next topic: " : "পরের Topic: ") + 'Satzmelodie' + " →";
}

function renderExamples() {
  const grid = document.getElementById("examples-grid");
  grid.innerHTML = "";
  EXAMPLES.forEach((ex, i) => {
    const card = document.createElement("div");
    card.className = "ex-card";
    card.innerHTML = `
      <div class="ex-word">${ex.word}</div>
      ${ex.ipa ? `<div class="ex-ipa">/${ex.ipa}/</div>` : ""}
      <div class="ex-bn">${localized(ex)}</div>
      ${ex.sentence ? `<div class="ex-sentence">${ex.sentence}</div>` : ""}
      <button class="play-btn" id="pb-${i}" onclick="playEx(${i})">🔊 Play</button>`;
    grid.appendChild(card);
  });
}

window.playEx = function(i) {
  const ex = EXAMPLES[i];
  const btn = document.getElementById("pb-"+i);
  btn.textContent = "⏹ Stop"; btn.classList.add("playing");
  responsiveVoice.speak(ex.word, _voice, {
    rate: 0.85,
    onend: () => { btn.textContent = "🔊 Play"; btn.classList.remove("playing"); }
  });
};

function renderExercises() {
  const wrap = document.getElementById("exercises-wrap");
  wrap.innerHTML = EXERCISES.map((ex, qi) => `
    <div class="ex-item" id="ex-${qi}">
      <div class="ex-q">${qi+1}. ${getLang()==="en" ? ex.qEn : ex.qBn}</div>
      <div class="ex-opts">
        ${ex.opts.map((o, ai) => `<button class="opt-btn" onclick="checkAns(${qi},${ai},this)">${getLang()==="en" ? (o.en||o.bn) : o.bn}</button>`).join("")}
      </div>
      <div class="ex-feedback" id="fb-${qi}"></div>
    </div>`).join("");
}

window.checkAns = function(qi, ai, btn) {
  if (btn.classList.contains("correct") || btn.classList.contains("wrong")) return;
  const c = chrome();
  const correct = EXERCISES[qi].answer;
  const fb = document.getElementById("fb-"+qi);
  document.querySelectorAll(`#ex-${qi} .opt-btn`).forEach(b => b.disabled = true);
  if (ai === correct) {
    btn.classList.add("correct");
    fb.textContent = c.correct; fb.style.color = "#34d399";
    _score++;
  } else {
    btn.classList.add("wrong");
    document.querySelectorAll(`#ex-${qi} .opt-btn`)[correct].classList.add("correct");
    fb.textContent = c.wrong; fb.style.color = "#fb7185";
  }
  _answered.add(qi);
};

function renderPronPage() {
  renderChrome(); renderExamples(); renderExercises();
}

window.setVoice = function(v, btn) {
  _voice = v;
  document.querySelectorAll(".vbtn").forEach(b => {
    b.classList.remove("active","male-active");
    b.style.cssText="";
  });
  if(v === "Deutsch Female") { btn.classList.add("active"); }
  else { btn.classList.add("male-active"); }
};


document.getElementById("btn-complete").onclick = async () => {
  const btn = document.getElementById("btn-complete");
  _completed = true; btn.disabled = true; btn.textContent = chrome().completedNow;
  await updateDoc(doc(db,"users",_uid), {
    completedTopics: arrayUnion("aussprache-wortakzent"),
    xp: increment(40),
    sessions: increment(1),
  }).catch(()=>{});
};

requireAuth(async user => {
  _uid = user.uid;
  const snap = await getDoc(doc(db,"users",user.uid));
  const d = snap.exists() ? snap.data() : {};

  if (d.language && d.language !== getLang()) {
    await setLang(d.language);
  }
  renderPronPage();
  renderSwitcher(document.getElementById("lang-switch-container"), {
    onChanged: lang => {
      updateDoc(doc(db, "users", user.uid), { language: lang }).catch(() => {});
      renderPronPage();
    },
  });

  const name = d.displayName || user.displayName || "Lerner";
  const photo = d.photoURL || user.photoURL || "";
  document.getElementById("nav-name").textContent = name;
  const av = document.getElementById("nav-avatar");
  if(photo) av.innerHTML = `<img src="${photo}">`;
  else av.textContent = name[0]?.toUpperCase()||"?";
  if((d.completedTopics||[]).includes("aussprache-wortakzent")) {
    _completed = true;
    const btn = document.getElementById("btn-complete");
    btn.disabled = true; btn.textContent = chrome().alreadyCompleted;
  }
  document.getElementById("btn-logout").onclick = async () => { await signOut(auth); location.href="../index.html"; };
});
</script>
</body>
</html>
