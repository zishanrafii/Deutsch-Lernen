<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080f;--surface:#080e1a;--surface2:#0c1322;--border:rgba(255,255,255,.055);
  --gold:#f5c842;--teal:#2dd4bf;--rose:#fb7185;--indigo:#818cf8;
  --emerald:#34d399;--muted:#64748b;--sub:#94a3b8;--text:#f0f4f8;
  --accent:#fb7185;--lv-color:#818cf8;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 0% 0%,rgba(245,200,66,.055),transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 100%,rgba(45,212,191,.045),transparent 55%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.008) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.008) 1px,transparent 1px);background-size:52px 52px;}
.wrap{max-width:900px;margin:auto;padding:1.6rem 1.4rem 4rem;position:relative;z-index:1;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;gap:1rem;flex-wrap:wrap;
  background:rgba(8,14,26,.8);border:1px solid var(--border);border-radius:18px;padding:.9rem 1.4rem;
  backdrop-filter:blur(24px);position:sticky;top:16px;z-index:100;}
.logo{display:flex;align-items:center;gap:14px;}
.logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(245,200,66,.18),rgba(45,212,191,.1));
  border:1px solid rgba(245,200,66,.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.logo-text h1{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#f5c842,#2dd4bf);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-text p{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.user-avatar{width:36px;height:36px;border-radius:50%;background:rgba(245,200,66,.15);
  display:flex;align-items:center;justify-content:center;border:2px solid rgba(245,200,66,.3);cursor:pointer;overflow:hidden;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.btn-logout{border:1px solid rgba(251,113,133,.2);background:rgba(251,113,133,.07);color:var(--rose);
  padding:.35rem .8rem;border-radius:10px;cursor:pointer;font-weight:600;font-family:'Outfit',sans-serif;font-size:12px;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:1.2rem;font-family:'JetBrains Mono',monospace;flex-wrap:wrap;}
.breadcrumb a{color:var(--sub);text-decoration:none;}.breadcrumb a:hover{color:var(--gold);}
/* HERO */
.hero{border-radius:22px;padding:1.8rem 2.2rem;margin-bottom:1.6rem;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#080e18,#0a1220);border:1px solid rgba(255,255,255,.07);}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent) 40%,var(--teal) 70%,transparent);}
.hero-inner{position:relative;z-index:2;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;}
.hero-icon{font-size:3.5rem;flex-shrink:0;}
.hero-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:.4rem;color:var(--accent);}
.hero h2{font-size:1.8rem;font-weight:800;letter-spacing:-.4px;margin-bottom:.3rem;}
.hero-sub{color:var(--sub);font-size:13px;line-height:1.65;font-family:'Noto Sans Bengali',sans-serif;}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:.8rem;}
.meta-pill{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--sub);}
.meta-pill.lv{background:rgba(52,211,153,.08);border-color:var(--lv-color);color:var(--lv-color);}
.meta-pill.xp{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.25);color:var(--gold);}
/* SECTION */
.section-title{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:10px;
  letter-spacing:1.5px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}
/* VOICE BAR */
.voice-bar{display:flex;align-items:center;gap:8px;margin-bottom:1.2rem;flex-wrap:wrap;}
.voice-label{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.vbtn{padding:.3rem .9rem;border-radius:20px;font-size:11.5px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'JetBrains Mono',monospace;transition:.2s;}
.vbtn.f-active{background:rgba(244,114,182,.1);border-color:rgba(244,114,182,.3);color:#f472b6;}
.vbtn.m-active{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.3);color:#38bdf8;}
/* VOCAB */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:1.6rem;}
.vocab-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;
  transition:.2s;position:relative;overflow:hidden;}
.vocab-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:3px 0 0 3px;}
.vocab-card:hover{border-color:rgba(255,255,255,.09);transform:translateY(-2px);}
.vc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem;}
.vc-de{font-size:1rem;font-weight:800;}
.vc-bn{font-size:12px;color:var(--sub);font-family:'Noto Sans Bengali',sans-serif;margin-bottom:.3rem;}
.vc-ex{font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid rgba(255,255,255,.04);padding-top:.4rem;margin-top:.3rem;}
.play-btn{background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.25);color:var(--teal);
  padding:2px 9px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:700;font-family:'Outfit',sans-serif;transition:.2s;}
.play-btn:hover{background:rgba(45,212,191,.2);}
/* DIALOGUE */
.dialogue-box{background:var(--surface2);border:1px solid var(--border);border-radius:18px;
  padding:1.4rem;margin-bottom:1.6rem;}
.dialog-line{display:flex;gap:10px;margin-bottom:.9rem;align-items:flex-start;}
.dialog-line:last-child{margin-bottom:0;}
.line-b{flex-direction:row-reverse;}
.dl-speaker{font-size:1.3rem;flex-shrink:0;margin-top:4px;}
.dl-bubble{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;
  padding:.75rem 1rem;max-width:80%;position:relative;}
.line-b .dl-bubble{background:rgba(45,212,191,.04);border-color:rgba(45,212,191,.15);}
.dl-de{font-size:13.5px;font-weight:700;margin-bottom:.2rem;}
.dl-bn{font-size:11.5px;color:var(--sub);font-family:'Noto Sans Bengali',sans-serif;margin-bottom:.4rem;}
.play-btn-sm{background:transparent;border:none;cursor:pointer;font-size:.9rem;color:var(--muted);transition:.15s;padding:0;}
.play-btn-sm:hover{color:var(--teal);}
/* PROMPT BOX */
.prompt-box{background:linear-gradient(135deg,rgba(129,140,248,.07),rgba(45,212,191,.05));
  border:1px solid rgba(129,140,248,.2);border-radius:16px;padding:1.2rem 1.4rem;margin-bottom:1.4rem;
  position:relative;overflow:hidden;}
.prompt-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#818cf8,transparent);}
.prompt-de{font-size:1.1rem;font-weight:800;margin-bottom:.3rem;}
.prompt-bn{font-size:12.5px;color:var(--sub);font-family:'Noto Sans Bengali',sans-serif;margin-bottom:.6rem;}
.prompt-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-play-prompt{background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.25);color:var(--teal);
  padding:.4rem 1rem;border-radius:10px;cursor:pointer;font-weight:700;font-family:'Outfit',sans-serif;font-size:12.5px;transition:.2s;}
.btn-play-prompt:hover{background:rgba(45,212,191,.18);}
/* TASKS */
.tasks-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:16px;
  padding:1.2rem 1.4rem;margin-bottom:1.6rem;}
.task-item{display:flex;align-items:center;gap:10px;padding:.65rem 0;border-bottom:1px solid rgba(255,255,255,.04);
  cursor:pointer;transition:.15s;font-size:13px;font-family:'Noto Sans Bengali',sans-serif;}
.task-item:last-child{border-bottom:none;}
.task-item:hover{padding-left:4px;color:var(--text);}
.task-cb{font-size:1rem;color:var(--muted);transition:.15s;flex-shrink:0;}
.task-item.done .task-cb{color:var(--emerald);}
.task-item.done span:last-child{color:var(--muted);text-decoration:line-through;}
/* XP BANNER */
.xp-banner{background:linear-gradient(135deg,rgba(245,200,66,.08),rgba(45,212,191,.06));
  border:1px solid rgba(245,200,66,.2);border-radius:16px;padding:1.1rem 1.4rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem;}
.xp-left{font-size:13px;font-family:'Noto Sans Bengali',sans-serif;color:var(--sub);}
.btn-complete{background:linear-gradient(135deg,#f5c842,#e0a820);color:#000;font-weight:800;border:none;
  border-radius:12px;padding:.65rem 1.4rem;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;transition:.2s;}
.btn-complete:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,200,66,.3);}
.btn-complete:disabled{opacity:.5;cursor:default;transform:none;}
/* NAV */
.page-nav{display:flex;align-items:center;justify-content:space-between;margin-top:1.5rem;gap:1rem;flex-wrap:wrap;}
.nav-btn{padding:.6rem 1.2rem;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;transition:.2s;font-family:'Outfit',sans-serif;}
.nav-btn:hover{border-color:rgba(255,255,255,.15);color:var(--text);}
.nav-btn.gold{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.3);color:var(--gold);}
.nav-btn.gold:hover{background:rgba(245,200,66,.18);}
@media(max-width:600px){.wrap{padding:1rem .9rem 3rem;}.hero h2{font-size:1.5rem;}.topbar{flex-direction:column;align-items:flex-start;}}
</style>

<script type="module">
import { auth, db, signOut, requireAuth,
  doc, getDoc, updateDoc, increment, arrayUnion } from "../js/firebase-config.js";

import { initI18n, t, getLang, setLang } from "../js/i18n.js";
import { renderSwitcher } from "../js/lang-switcher.js";

await initI18n();

const CHROME = {
  bn: {
    eyebrow: '🗣️ Speaking Topic',
    vocabTitle: '📖 Vokabeln — Vocabulary',
    dialogueTitle: '💬 Musterdialog — Sample Dialogue',
    playFull: 'সম্পূর্ণ dialog play করুন',
    tasksTitle: '✅ Speaking Tasks — এগুলো practice করুন',
    xpBefore: 'এই topic সম্পন্ন করলে',
    xpAfter: 'পাবে।',
    completeBtn: '⭐ Complete (+50 XP)',
    completedNow: '✅ সম্পন্ন!',
    alreadyCompleted: '✅ আগেই সম্পন্ন',
    subtitle: 'মতবিরোধ সমাধান ও diplomacy German-এ।',
    vocabCount: '12 Vocab',
    dialogCount: '6 Dialog lines',
  },
  en: {
    eyebrow: '🗣️ Speaking Topic',
    vocabTitle: '📖 Vokabeln — Vocabulary',
    dialogueTitle: '💬 Musterdialog — Sample Dialogue',
    playFull: 'Play the full dialogue',
    tasksTitle: '✅ Speaking Tasks — practice these',
    xpBefore: 'Complete this topic to earn',
    xpAfter: '.',
    completeBtn: '⭐ Complete (+50 XP)',
    completedNow: '✅ Completed!',
    alreadyCompleted: '✅ Already completed',
    subtitle: 'Resolving disagreements and diplomacy, in German.',
    vocabCount: '12 Vocab',
    dialogCount: '6 Dialog lines',
  },
};

const VOCAB = [
  { de:'das Missverständnis', bn:'ভুল বোঝাবুঝি', en:'misunderstanding', ex:'Es gibt ein Missverständnis.' },
  { de:'sich entschuldigen', bn:'ক্ষমা চাওয়া', en:'to apologize', ex:'Ich entschuldige mich dafür.' },
  { de:'der Kompromiss', bn:'আপোষ', en:'compromise', ex:'Wir finden einen Kompromiss.' },
  { de:'vermitteln', bn:'মধ্যস্থতা করা', en:'to mediate', ex:'Können Sie vermitteln?' },
  { de:'die Lösung', bn:'সমাধান', en:'solution', ex:'Ich schlage eine Lösung vor.' },
  { de:'sachlich bleiben', bn:'বস্তুনিষ্ঠ থাকা', en:'to stay objective', ex:'Bitte bleiben Sie sachlich.' },
  { de:'zuhören', bn:'মনোযোগ দিয়ে শোনা', en:'to listen', ex:'Bitte hören Sie mir zu.' },
  { de:'gemeinsam', bn:'একসাথে', en:'together', ex:'Wir lösen das gemeinsam.' },
  { de:'der Konflikt', bn:'দ্বন্দ্ব/বিরোধ', en:'conflict', ex:'Den Konflikt müssen wir lösen.' },
  { de:'der Vorwurf', bn:'অভিযোগ', en:'accusation', ex:'Das ist ein unfairer Vorwurf.' },
  { de:'akzeptieren', bn:'মেনে নেওয়া', en:'to accept', ex:'Ich akzeptiere Ihre Entscheidung.' },
  { de:'konstruktiv', bn:'গঠনমূলক', en:'constructive', ex:'Bitte seien Sie konstruktiv.' }
];
const DIALOGUE = [
  { spk:'a', de:'Ich muss mit Ihnen über ein Problem sprechen.', bn:'আমাকে আপনার সাথে একটি সমস্যা নিয়ে কথা বলতে হবে।', en:'I need to talk to you about a problem.' },
  { spk:'b', de:'Natürlich. Was ist passiert?', bn:'অবশ্যই। কী হয়েছে?', en:'Of course. What happened?' },
  { spk:'a', de:'Ich habe das Gefühl, dass meine Arbeit nicht anerkannt wird.', bn:'আমার মনে হচ্ছে আমার কাজ স্বীকৃত হচ্ছে না।', en:'I feel like my work isn\'t being recognized.' },
  { spk:'b', de:'Das tut mir leid zu hören. Können Sie ein Beispiel nennen?', bn:'এটা শুনে দুঃখিত হলাম। একটি উদাহরণ দিতে পারবেন?', en:'I\'m sorry to hear that. Can you give an example?' },
  { spk:'a', de:'Beim letzten Meeting wurden meine Ideen nicht erwähnt.', bn:'গত meeting-এ আমার ideas উল্লেখ করা হয়নি।', en:'At the last meeting, my ideas weren\'t mentioned.' },
  { spk:'b', de:'Das war ein Versehen. Wie können wir das in Zukunft besser machen?', bn:'এটা ভুলবশত হয়েছে। ভবিষ্যতে এটা কীভাবে ভালো করতে পারি?', en:'That was an oversight. How can we do better going forward?' }
];
const TASKS = [
  { bn:'বিনয়ের সাথে একটি অভিযোগ করো।', en:'Make a complaint politely.' },
  { bn:'ক্ষমা চাওয়ার phrases German-এ বলো।', en:'Say phrases for apologizing, in German.' },
  { bn:'একটি Kompromiss প্রস্তাব করো।', en:'Propose a compromise.' },
  { bn:'শান্তিপূর্ণভাবে মতবিরোধ সমাধান করো।', en:'Resolve a disagreement peacefully.' }
];

function chrome() { return getLang() === "en" ? CHROME.en : CHROME.bn; }
function localized(item) { return getLang() === "en" ? (item.en || item.bn) : item.bn; }

let _completed = false;

function renderChrome() {
  const c = chrome();
  document.getElementById("hero-eyebrow").textContent      = c.eyebrow;
  document.getElementById("hero-sub").textContent          = c.subtitle;
  document.getElementById("meta-vocab-count").textContent  = c.vocabCount;
  document.getElementById("meta-dialog-count").textContent = c.dialogCount;
  document.getElementById("vocab-section-title").textContent    = c.vocabTitle;
  document.getElementById("dialogue-section-title").textContent = c.dialogueTitle;
  document.getElementById("play-full-label").textContent        = c.playFull;
  document.getElementById("tasks-section-title").textContent    = c.tasksTitle;
  document.getElementById("xp-banner-text").innerHTML =
    `${c.xpBefore} <strong style="color:var(--gold)">+50 XP</strong> ${c.xpAfter}`;
  const btn = document.getElementById("btn-complete");
  if (_completed) { btn.disabled = true; btn.textContent = c.alreadyCompleted; }
  else { btn.textContent = c.completeBtn; }
}

function renderVocab() {
  document.getElementById("vocab-grid").innerHTML = VOCAB.map((v, i) => `
    <div class="vocab-card">
      <div class="vc-top">
        <div class="vc-de">${v.de}</div>
        <button onclick="playText('${v.de.replace(/'/g, "\\'")}',${i})" class="play-btn" id="vplay-${i}">🔊</button>
      </div>
      <div class="vc-bn">${localized(v)}</div>
      <div class="vc-ex">${v.ex}</div>
    </div>`).join("");
}

function renderDialogue() {
  document.getElementById("dialogue-lines").innerHTML = DIALOGUE.map((l, i) => `
    <div class="dialog-line line-${l.spk}">
      <div class="dl-speaker">${l.spk === "a" ? "🧑 A" : "👤 B"}</div>
      <div class="dl-bubble">
        <div class="dl-de">${l.de}</div>
        <div class="dl-bn">${localized(l)}</div>
        <button onclick="playText('${l.de.replace(/'/g, "\\'")}',${999 + i})" class="play-btn-sm">🔊</button>
      </div>
    </div>`).join("");
}

function renderTasks() {
  document.getElementById("tasks-wrap").innerHTML = TASKS.map(task => `
    <div class="task-item" onclick="toggleTask(this)"><span class="task-cb">○</span> <span>${localized(task)}</span></div>`).join("");
}

function renderTopicPage() {
  renderChrome(); renderVocab(); renderDialogue(); renderTasks();
}

const DIALOGS = DIALOGUE.map(l => l.de);

let _voice = "Deutsch Female";
let _uid;

window.setVoice = function(v, btn, type) {
  _voice = v;
  document.querySelectorAll(".vbtn").forEach(b => b.className="vbtn");
  btn.classList.add(type==="f" ? "f-active" : "m-active");
};

window.playText = function(text, i) {
  responsiveVoice.cancel();
  responsiveVoice.speak(text, _voice, { rate:0.88 });
};

window.playAllDialog = function() {
  responsiveVoice.cancel();
  let idx = 0;
  function next() {
    if(idx >= DIALOGS.length) return;
    responsiveVoice.speak(DIALOGS[idx], _voice, {
      rate: 0.88,
      onend: () => { idx++; setTimeout(next, 600); }
    });
  }
  next();
};

window.toggleTask = function(el) {
  el.classList.toggle("done");
  el.querySelector(".task-cb").textContent = el.classList.contains("done") ? "✓" : "○";
};

document.getElementById("btn-complete").onclick = async () => {
  const btn = document.getElementById("btn-complete");
  _completed = true; btn.disabled=true; btn.textContent=chrome().completedNow;
  await updateDoc(doc(db,"users",_uid), {
    completedTopics: arrayUnion("topic-konflikte"),
    xp: increment(50),
    sessions: increment(1),
  }).catch(()=>{});
};

requireAuth(async user => {
  _uid = user.uid;
  const snap = await getDoc(doc(db,"users",user.uid));
  const d = snap.exists() ? snap.data() : {};

  if (d.language && d.language !== getLang()) {
    await setLang(d.language);
  }
  renderTopicPage();
  renderSwitcher(document.getElementById("lang-switch-container"), {
    onChanged: lang => {
      updateDoc(doc(db, "users", user.uid), { language: lang }).catch(() => {});
      renderTopicPage();
    },
  });
  const name = d.displayName||user.displayName||"Lerner";
  const photo = d.photoURL||user.photoURL||"";
  document.getElementById("nav-name").textContent = name;
  const av = document.getElementById("nav-avatar");
  if(photo) av.innerHTML=`<img src="${photo}">`;
  else av.textContent = name[0]?.toUpperCase()||"?";
  if((d.completedTopics||[]).includes("topic-konflikte")) {
    const btn = document.getElementById("btn-complete");
    _completed = true; btn.disabled=true; btn.textContent=chrome().alreadyCompleted;
  }
  document.getElementById("btn-logout").onclick = async()=>{ await signOut(auth); location.href="../index.html"; };
});
</script>

<script type="module">
import { renderUserMenu } from "/js/user-menu.js";
function dlMirrorUserMenu(){
  const nameEl = document.getElementById("nav-name");
  const container = document.getElementById("user-menu-container");
  const oldLogout = document.getElementById("btn-logout") || document.getElementById("btn-logout-top");
  if(!nameEl || !container) return;
  const name = (nameEl.textContent||"").trim();
  if(!name || /\.\.\.|loading|\u09B2\u09CB\u09A1/i.test(name)) return;
  const av = document.getElementById("nav-avatar");
  const img = av ? av.querySelector("img") : null;
  const photo = img ? img.getAttribute("src") : "";
  renderUserMenu(container, {
    name, photo, plan: "free",
    onLogout: () => oldLogout && oldLogout.click(),
  });
}
let dlTries = 0;
const dlIv = setInterval(() => { dlMirrorUserMenu(); if(++dlTries > 30) clearInterval(dlIv); }, 250);
</script>

<script type="module">
import { renderBottomNav } from "/js/bottom-nav.js";
renderBottomNav();
</script>
