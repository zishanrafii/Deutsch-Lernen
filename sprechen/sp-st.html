.logo{display:flex;align-items:center;gap:14px;}

.logo-text h1{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#f5c842,#2dd4bf);

.topbar-right{display:flex;align-items:center;gap:8px;}

.btn-logout{border:1px solid rgba(251,113,133,.2);background:rgba(251,113,133,.07);color:var(--rose);

.breadcrumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:1.2rem;font-family:'JetBrains Mono',monospace;flex-wrap:wrap;}
.breadcrumb a{color:var(--sub);text-decoration:none;}.breadcrumb a:hover{color:var(--gold);}
/* HERO */
.hero{border-radius:22px;padding:1.8rem 2.2rem;margin-bottom:1.6rem;position:relative;overflow:hidden;

.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}

.ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem;

.voice-bar{display:flex;align-items:center;gap:8px;margin-bottom:1.2rem;flex-wrap:wrap;}

.vbtn.male-active{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.3);color:#38bdf8;}

.opt-btn.wrong{background:rgba(251,113,133,.1);border-color:var(--rose);color:var(--rose);}
.ex-feedback{font-size:12px;margin-top:.5rem;font-family:'Noto Sans Bengali',sans-serif;min-height:18px;}

.xp-banner{background:linear-gradient(135deg,rgba(245,200,66,.08),rgba(45,212,191,.06));

.xp-left{font-size:13px;font-family:'Noto Sans Bengali',sans-serif;color:var(--sub);}
.xp-left strong{color:var(--text);font-size:15px;}

.btn-complete:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,200,66,.3);}
.btn-complete:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}
/* NAV BUTTONS */
.page-nav{display:flex;align-items:center;justify-content:space-between;margin-top:2rem;gap:1rem;flex-wrap:wrap;}
.nav-btn{padding:.6rem 1.2rem;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;transition:.2s;font-family:'Outfit',sans-serif;}
.nav-btn:hover{border-color:rgba(255,255,255,.15);color:var(--text);}
.nav-btn.gold{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.3);color:var(--gold);}
.nav-btn.gold:hover{background:rgba(245,200,66,.18);}
@media(max-width:600px){.wrap{padding:1rem .9rem 3rem;}.hero h2{font-size:1.5rem;}.topbar{flex-direction:column;align-items:flex-start;}}

};
const THEORY_BN = '<p><strong>SP শব্দের শুরুতে = [ʃp]</strong><br><strong>Sprechen</strong> = \'শপ্রেখেন\' (SP → Sch+P)<br><strong>Spiel</strong> = \'শপিল\' | <strong>Sport</strong> = \'শপোর্ট\'</p><p><strong>ST শব্দের শুরুতে = [ʃt]</strong><br><strong>Stadt</strong> = \'শটাট\' (ST → Sch+T)<br><strong>stehen</strong> = \'শটেহেন\' | <strong>Strand</strong> = \'শট্রান্ট\'</p><p><strong>গুরুত্বপূর্ণ:</strong> এই নিয়ম শুধু শব্দের <strong>শুরুতে</strong>। মাঝে বা শেষে SP/ST আলাদাভাবে উচ্চারিত হয়।</p><div class="tip-box"><strong>💡 উদাহরণ:</strong> \'kosten\' → K-O-S-TEN (মাঝে, তাই [st]); কিন্তু \'stehen\' → [ʃt] কারণ শুরুতে।</div>';
const THEORY_EN = '<p><strong>SP at the start of a word = [ʃp]</strong><br><strong>Sprechen</strong> = \'shprechen\' (SP → sch+p)<br><strong>Spiel</strong> = \'shpeel\' | <strong>Sport</strong> = \'shport\'</p><p><strong>ST at the start of a word = [ʃt]</strong><br><strong>Stadt</strong> = \'shtat\' (ST → sch+t)<br><strong>stehen</strong> = \'shtehen\' | <strong>Strand</strong> = \'shtrand\'</p><p><strong>Important:</strong> this rule only applies at the <strong>start</strong> of a word. In the middle or at the end, SP/ST are pronounced normally.</p><div class="tip-box"><strong>💡 Example:</strong> \'kosten\' → K-O-S-TEN (in the middle, so [st]); but \'stehen\' → [ʃt] because it\'s at the start.</div>';

  { word:'spazieren', ipa:'ʃpaˈtsiːʁən', bn:'হাঁটা', en:'to stroll', sentence:'Ich gehe spazieren.' },
  { word:'Straße', ipa:'ˈʃtʁaːsə', bn:'রাস্তা', en:'street', sentence:'Die Straße ist breit.' }
];
const EXERCISES = [

function localized(item) { return getLang() === "en" ? (item.en || item.bn) : item.bn; }

let _completed = false;
let _answered = new Set();

function renderChrome() {
  const c = chrome();
  document.getElementById("hero-eyebrow").textContent = c.eyebrow;
  document.getElementById("hero-sub").textContent = c.subtitle;
  document.getElementById("meta-examples").textContent = `12 ${getLang()==="en"?"Examples":"Examples"}`;
  document.getElementById("meta-exercises").textContent = `5 ${getLang()==="en"?"Exercises":"Exercises"}`;
  document.getElementById("theory-title").textContent = c.theoryTitle;
  document.getElementById("examples-title").textContent = c.examplesTitle;
  document.getElementById("exercises-title").textContent = c.exercisesTitle;
  document.getElementById("theory-box").innerHTML = getLang() === "en" ? THEORY_EN : THEORY_BN;
  document.getElementById("xp-banner-text").innerHTML =
    `<strong>SP & ST</strong> ${c.xpAfter} <strong style="color:var(--gold)">+25 XP</strong>` +
    `<div style="margin-top:3px;font-size:11.5px;">${c.xpHint}</div>`;
  const btn = document.getElementById("btn-complete");
  if (_completed) { btn.disabled = true; btn.textContent = c.alreadyCompleted; }
  else { btn.textContent = c.completeBtn + " (+25 XP)"; }
  const nextLbl = document.getElementById("next-topic-label");
  if (nextLbl) nextLbl.textContent = (getLang()==="en" ? "Next topic: " : "পরের Topic: ") + 'Lange & kurze Vokale' + " →";
}

function renderExamples() {
  const grid = document.getElementById("examples-grid");
  grid.innerHTML = "";
  EXAMPLES.forEach((ex, i) => {
    const card = document.createElement("div");
    card.className = "ex-card";
    card.innerHTML = `
      <div class="ex-word">${ex.word}</div>
      ${ex.ipa ? `<div class="ex-ipa">/${ex.ipa}/</div>` : ""}
      <div class="ex-bn">${localized(ex)}</div>
      ${ex.sentence ? `<div class="ex-sentence">${ex.sentence}</div>` : ""}
      <button class="play-btn" id="pb-${i}" onclick="playEx(${i})">🔊 Play</button>`;
    grid.appendChild(card);
  });
}

window.playEx = function(i) {
  const ex = EXAMPLES[i];
  const btn = document.getElementById("pb-"+i);
  btn.textContent = "⏹ Stop"; btn.classList.add("playing");
  responsiveVoice.speak(ex.word, _voice, {
    rate: 0.85,
    onend: () => { btn.textContent = "🔊 Play"; btn.classList.remove("playing"); }
  });
};

function renderExercises() {
  const wrap = document.getElementById("exercises-wrap");
  wrap.innerHTML = EXERCISES.map((ex, qi) => `
    <div class="ex-item" id="ex-${qi}">
      <div class="ex-q">${qi+1}. ${getLang()==="en" ? ex.qEn : ex.qBn}</div>
      <div class="ex-opts">
        ${ex.opts.map((o, ai) => `<button class="opt-btn" onclick="checkAns(${qi},${ai},this)">${getLang()==="en" ? (o.en||o.bn) : o.bn}</button>`).join("")}
      </div>
      <div class="ex-feedback" id="fb-${qi}"></div>
    </div>`).join("");
}

window.checkAns = function(qi, ai, btn) {
  if (btn.classList.contains("correct") || btn.classList.contains("wrong")) return;
  const c = chrome();
  const correct = EXERCISES[qi].answer;
  const fb = document.getElementById("fb-"+qi);
  document.querySelectorAll(`#ex-${qi} .opt-btn`).forEach(b => b.disabled = true);
  if (ai === correct) {
    btn.classList.add("correct");
    fb.textContent = c.correct; fb.style.color = "#34d399";
    _score++;
  } else {
    btn.classList.add("wrong");
    document.querySelectorAll(`#ex-${qi} .opt-btn`)[correct].classList.add("correct");
    fb.textContent = c.wrong; fb.style.color = "#fb7185";
  }
  _answered.add(qi);
};

function renderPronPage() {
  renderChrome(); renderExamples(); renderExercises();
}

window.setVoice = function(v, btn) {
  _voice = v;
  document.querySelectorAll(".vbtn").forEach(b => {
    b.classList.remove("active","male-active");
    b.style.cssText="";
  });
  if(v === "Deutsch Female") { btn.classList.add("active"); }
  else { btn.classList.add("male-active"); }
};


document.getElementById("btn-complete").onclick = async () => {
  const btn = document.getElementById("btn-complete");
  _completed = true; btn.disabled = true; btn.textContent = chrome().completedNow;
  await updateDoc(doc(db,"users",_uid), {
    completedTopics: arrayUnion("aussprache-sp-st"),
    xp: increment(25),
    sessions: increment(1),
  }).catch(()=>{});
};

requireAuth(async user => {
  _uid = user.uid;
  const snap = await getDoc(doc(db,"users",user.uid));
  const d = snap.exists() ? snap.data() : {};

  if (d.language && d.language !== getLang()) {
    await setLang(d.language);
  }
  renderPronPage();
  renderSwitcher(document.getElementById("lang-switch-container"), {
    onChanged: lang => {
      updateDoc(doc(db, "users", user.uid), { language: lang }).catch(() => {});
      renderPronPage();
    },
  });

  const name = d.displayName || user.displayName || "Lerner";
  const photo = d.photoURL || user.photoURL || "";
  document.getElementById("nav-name").textContent = name;
  const av = document.getElementById("nav-avatar");
  if(photo) av.innerHTML = `<img src="${photo}">`;
  else av.textContent = name[0]?.toUpperCase()||"?";
  if((d.completedTopics||[]).includes("aussprache-sp-st")) {
    _completed = true;
    const btn = document.getElementById("btn-complete");
    btn.disabled = true; btn.textContent = chrome().alreadyCompleted;
  }
  document.getElementById("btn-logout").onclick = async () => { await signOut(auth); location.href="../index.html"; };
});
</script>

<script type="module">
import { renderUserMenu } from "/js/user-menu.js";
function dlMirrorUserMenu(){
  const nameEl = document.getElementById("nav-name");
  const container = document.getElementById("user-menu-container");
  const oldLogout = document.getElementById("btn-logout") || document.getElementById("btn-logout-top");
  if(!nameEl || !container) return;
  const name = (nameEl.textContent||"").trim();
  if(!name || /\.\.\.|loading|\u09B2\u09CB\u09A1/i.test(name)) return;
  const av = document.getElementById("nav-avatar");
  const img = av ? av.querySelector("img") : null;
  const photo = img ? img.getAttribute("src") : "";
  renderUserMenu(container, {
    name, photo, plan: "free",
    onLogout: () => oldLogout && oldLogout.click(),
  });
}
let dlTries = 0;
const dlIv = setInterval(() => { dlMirrorUserMenu(); if(++dlTries > 30) clearInterval(dlIv); }, 250);
</script>

import { renderBottomNav } from "/js/bottom-nav.js";
renderBottomNav();
</script>
