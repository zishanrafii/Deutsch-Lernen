# netlify.toml — Deutsch Lernen
# Tells Netlify where the serverless functions live.

[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# ── API route shortcuts ──────────────────────────────
[[redirects]]
  from = "/api/writing-feedback"
  to = "/.netlify/functions/writing-feedback"
  status = 200

[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from = "/api/sslcommerz-init"
  to = "/.netlify/functions/sslcommerz-init"
  status = 200

[[redirects]]
  from = "/api/sslcommerz-ipn"
  to = "/.netlify/functions/sslcommerz-ipn"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

